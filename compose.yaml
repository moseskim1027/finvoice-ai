services:
  api:
    build:
      context: .
      target: runtime
    environment:
      FINVOICE_ENVIRONMENT: local
      FINVOICE_LOG_LEVEL: INFO
      FINVOICE_MINIMUM_RESPONSE_CONFIDENCE: "0.70"
    ports:
      - "8000:8000"
    init: true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  test:
    build:
      context: .
      target: development
    command: pytest

  lint:
    build:
      context: .
      target: development
    command: sh -c "ruff check . && ruff format --check ."

  evaluate-retrieval:
    build:
      context: .
      target: development
    command: python -m finvoice_ai.evaluation.retrieval

  evaluate-speech:
    build:
      context: .
      target: development
    entrypoint: ["python", "-m", "finvoice_ai.evaluation.speech_runner"]
    command: ["--help"]

  evaluate-speech-asr:
    profiles: ["asr"]
    build:
      context: .
      target: asr
    entrypoint: ["python", "-m", "finvoice_ai.evaluation.speech_runner"]
    command: ["--help"]
    environment:
      FINVOICE_TRANSCRIPTION_PROVIDER: faster_whisper
      FINVOICE_WHISPER_MODEL_SIZE: small
      FINVOICE_WHISPER_DEVICE: cpu
      FINVOICE_WHISPER_COMPUTE_TYPE: int8
    volumes:
      - whisper-cache:/root/.cache/huggingface

  mcp:
    build:
      context: .
      target: runtime
    command: python -m finvoice_ai.mcp_server
    stdin_open: true
    init: true
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true

  asr:
    profiles: ["asr"]
    build:
      context: .
      target: asr
    environment:
      FINVOICE_TRANSCRIPTION_PROVIDER: faster_whisper
      FINVOICE_WHISPER_MODEL_SIZE: small
      FINVOICE_WHISPER_DEVICE: cpu
      FINVOICE_WHISPER_COMPUTE_TYPE: int8
    ports:
      - "8000:8000"
    volumes:
      - whisper-cache:/root/.cache/huggingface

volumes:
  whisper-cache:
