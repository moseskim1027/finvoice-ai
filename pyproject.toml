[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "finvoice-ai"
version = "0.1.0"
description = "Research-to-production scaffold for a safe financial-support voice agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "mcp>=2.0,<3.0",
  "opentelemetry-api>=1.28,<2.0",
  "opentelemetry-sdk>=1.28,<2.0",
  "pydantic-settings>=2.6,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
asr = [
  "faster-whisper>=1.2.1,<2.0",
]
research = [
  "numpy>=2.0,<3.0",
  "scikit-learn>=1.5,<2.0",
]
dev = [
  "httpx>=0.28,<1.0",
  "numpy>=2.0,<3.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.8,<1.0",
  "scikit-learn>=1.5,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finvoice_ai"]

[tool.pytest.ini_options]
addopts = "--cov=finvoice_ai --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
